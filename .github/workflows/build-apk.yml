name: Build Android APK

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 🔑 Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🧪 Run Unit Tests
        run: |
          gradle testDebugUnitTest --continue --no-daemon

      - name: 📦 Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 📝 Add Summary to Job
        if: always()
        run: |
          echo "### ᚱ Результаты сборки APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app-debug.apk" ]; then
            FILE_SIZE=$(du -h "app-debug.apk" | cut -f1)
            echo "- **Статус:** ✅ Успешно собрано в корне проекта (\`app-debug.apk\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Размер APK:** \`$FILE_SIZE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Статус:** ❌ Сборка не удалась (проверьте логи выше)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔀 Auto-merge Pull Request & Delete Branch
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Auto-merging Pull Request and deleting branch..."
          gh pr merge "$PR_URL" --squash --delete-branch || gh pr merge "$PR_URL" --auto --squash --delete-branch || true

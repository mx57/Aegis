name: Build Android APK

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 🔑 Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🧪 Run Unit Tests
        run: |
          gradle testDebugUnitTest --continue --no-daemon

      - name: 📦 Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 🔍 Find Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error: APK file was not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          
          FILE_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runic-stave-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      - name: 📝 Add Summary to Job
        if: always()
        run: |
          echo "### ᚱ Результаты сборки APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.find_apk.outputs.apk_path }}" != "" ]; then
            echo "- **Статус:** ✅ Успешно собрано" >> $GITHUB_STEP_SUMMARY
            echo "- **Размер APK:** \`${{ steps.find_apk.outputs.apk_size }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Артефакт:** Скачайте \`runic-stave-debug-apk\` во вкладке Artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Статус:** ❌ Сборка не удалась (проверьте логи выше)" >> $GITHUB_STEP_SUMMARY
          fi
